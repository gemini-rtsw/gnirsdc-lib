name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      scripts_dir: gemini-rtsw-ci
      # No EPICS content, so no gemini-ade or rpm-repo dependency container.
      # EPEL and CRB come from custom-repo-setup.sh.
      profile: lightweight
      # EL9 only: the module is built for EL9's Python 3.9, which the GNIRS DC
      # image runs.
      el_version: '9'

  publish:
    needs: build
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main
    secrets: inherit
