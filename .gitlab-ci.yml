stages:
 - build
before_script:
 - 'git remote set-url origin https://oauth2:$GIT_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-lib.git'
build_image:
 stage: build
 image: docker:latest
 services:
   - docker:dind

 script:
   - docker build -t gnirsdc-lib-env -f Dockerfile_rocky8 .
   - docker run --rm -v .:/repo gnirsdc-lib-env bash -l -c "cd /repo && make clean all" 
   - git config --global user.email "$GITLAB_USER_EMAIL"
   - git config --global user.name "$GITLAB_USER_NAME"
   - git commit -am"pipeline generated commit of shared libraries [skip ci]" 
   - git push origin HEAD:pybind11

 rules:
   - if: '$CI_COMMIT_BRANCH == "pybind11"'
